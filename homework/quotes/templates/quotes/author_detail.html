{% extends 'quotes/base.html' %}

{% block content %}
<div class="container mt-3">
    <h2>{{ author.author_fullname }}</h2>
    <p><strong>Born:</strong> {{ author.born_date }} in {{ author.born_location }}</p>
    {% if author.description %}
    <p><strong>Description:</strong> {{ author.description }}</p>
    {% endif %}

</div>
<div class="col-md-4">
    <p>
        <a href="{% url 'quotes:root' %}" class="btn btn-success">Back to main page</a>
    </p>

</div>
{% endblock %}
