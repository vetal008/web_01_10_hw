<!doctype html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta content="width=device-width, user-scalable=no, initial-scale=1.0, maximum-scale=1.0, minimum-scale=1.0"
          name="viewport">
    <meta content="ie=edge" http-equiv="X-UA-Compatible">
    <link crossorigin="anonymous" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.8/dist/css/bootstrap.min.css"
          integrity="sha384-sRIl4kxILFvY47J16cr9ZwB07vP4J8+LH7qKQnuqkuIAvNWLzeN8tE5YBujZqJLB" rel="stylesheet">
    {% load static %}
    <link rel="stylesheet" href="{% static 'quotes/style.css' %}">
    <title>Homework</title>
</head>
<body>
<div class="container">
    <div class="row header-box">
        <div class="col-md-8">
            <h1>
                <a href="/" style="text-decoration: none">Quotes to Scrape</a>
            </h1>
        </div>
    </div>
</div>
<div class="col-md-4 negative-margin-end">
    <p>
        {% if user.is_anonymous %}
        <a href="{% url 'users:signup' %}" class="btn btn-success">Signup</a>
        <a href="{% url 'users:login' %}" class="btn btn-success">Login</a>
        {% else %}
        <a href="{% url 'users:logout' %}" class="btn btn-secondary">Logout</a>
        {% endif %}
    </p>
    <p>
</div>
{% block content %}
{% endblock %}
